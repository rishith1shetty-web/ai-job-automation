# Alembic configuration.
#
# NOTE: there is deliberately NO sqlalchemy.url here. The database URL is supplied at runtime
# by alembic/env.py from the application settings (app.config.get_settings().database_url),
# which reads DATABASE_URL from the environment or .env. Never write a URL or a password into
# this file -- it is committed to source control.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, readable revision filenames (e.g. 2026_07_27_1430-a1b2c3d4e5f6_baseline.py).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
